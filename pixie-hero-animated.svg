<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">pixie — Computer Science student, networking major</title>
  <desc id="desc">Dark pixel city banner with magenta moon and cat silhouette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#140814"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#FF8DD2" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#FF4FB3" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FF4FB3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF4FB3"/>
      <stop offset="1" stop-color="#D946EF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="78" height="58" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="15" r="1" fill="#FF4FB3" opacity=".55"/>
      <circle cx="52" cy="35" r="1.2" fill="#F9A8D4" opacity=".45"/>
      <circle cx="72" cy="8" r=".8" fill="#FFFFFF" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="418" rx="21" fill="none" stroke="#30363D"/>

  <!-- stars -->
  <rect x="590" y="20" width="660" height="250" fill="url(#stars)" opacity=".95"/>

  <!-- moon -->
  <circle cx="1005" cy="96" r="90" fill="url(#moonGlow)">
    <animate attributeName="r" values="86;96;86" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1005" cy="96" r="43" fill="#FF63BE" filter="url(#glow)">
    <animate attributeName="r" values="41;44;41" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#251124" opacity=".9">
    <path d="M705 112h180c-8-23-31-37-56-31-11-23-47-26-62-5-28-9-56 9-62 36z"/>
    <path d="M873 155h150c-9-19-27-30-49-25-14-21-47-19-58 4-20-5-37 4-43 21z"/>
  </g>

  <!-- city -->
  <g>
    <rect x="660" y="245" width="80" height="175" fill="#0A0F14"/>
    <rect x="752" y="204" width="92" height="216" fill="#0B1016"/>
    <rect x="856" y="264" width="66" height="156" fill="#090D12"/>
    <rect x="934" y="225" width="106" height="195" fill="#0A0E14"/>
    <rect x="1050" y="280" width="58" height="140" fill="#0A0D12"/>
    <rect x="1120" y="239" width="94" height="181" fill="#0B1016"/>
    <g fill="#FF4FB3" opacity=".9">
      <animate attributeName="opacity" values=".62;.95;.72;.9;.62" dur="5.8s" repeatCount="indefinite"/>
      <rect x="676" y="269" width="8" height="8"/><rect x="696" y="269" width="8" height="8"/><rect x="716" y="269" width="8" height="8"/>
      <rect x="676" y="292" width="8" height="8"/><rect x="716" y="292" width="8" height="8"/>
      <rect x="770" y="228" width="9" height="9"/><rect x="793" y="228" width="9" height="9"/><rect x="816" y="228" width="9" height="9"/>
      <rect x="770" y="254" width="9" height="9"/><rect x="816" y="254" width="9" height="9"/>
      <rect x="873" y="287" width="8" height="8"/><rect x="895" y="287" width="8" height="8"/>
      <rect x="955" y="250" width="9" height="9"/><rect x="980" y="250" width="9" height="9"/><rect x="1005" y="250" width="9" height="9"/>
      <rect x="955" y="276" width="9" height="9"/><rect x="1005" y="276" width="9" height="9"/>
      <rect x="1139" y="264" width="8" height="8"/><rect x="1161" y="264" width="8" height="8"/><rect x="1183" y="264" width="8" height="8"/>
    </g>
  </g>

  <!-- rooftop -->
  <path d="M590 363H1280V420H590z" fill="#06090D"/>
  <rect x="590" y="359" width="690" height="4" fill="#FF4FB3" opacity=".65"/>

  <!-- pixel cat silhouette -->
  <g transform="translate(915 230)">
    <path d="M38 102V68L25 50V26L43 38L58 30L74 38L92 26V50L80 68V102H98V116H18V102H38z" fill="#030508" stroke="#FF4FB3" stroke-width="3"/>
    <g fill="#FF4FB3">
      <rect x="46" y="55" width="5" height="5"/>
      <rect x="68" y="55" width="5" height="5"/>
      <animate attributeName="opacity" values="1;1;0.05;1;1" keyTimes="0;0.82;0.86;0.90;1" dur="5.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M80 82c16 0 26 8 30 19" fill="none" stroke="#FF4FB3" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-5 80 82;6 80 82;-5 80 82"
        dur="3.2s" repeatCount="indefinite"/>
    </g>
  </g>


  <!-- animated stars -->
  <g fill="#FFB6DE">
    <circle cx="625" cy="72" r="2">
      <animate attributeName="opacity" values=".15;1;.15" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="48" r="1.7">
      <animate attributeName="opacity" values=".2;1;.2" dur="3.4s" begin=".7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1162" cy="78" r="1.8">
      <animate attributeName="opacity" values=".1;.9;.1" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- tiny shooting star -->
  <g opacity="0">
    <line x1="700" y1="92" x2="735" y2="72" stroke="#FFB6DE" stroke-width="2" stroke-linecap="round"/>
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.62;.66;.73;1" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;75 36;120 58;120 58" keyTimes="0;.62;.66;.73;1" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- terminal card -->
  <g transform="translate(1090 128)">
    <rect width="150" height="132" rx="10" fill="#090D12" stroke="#5B2146"/>
    <text x="18" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FF63BE">&gt; ideas<animate attributeName="opacity" values=".45;1;.45" dur="2s" begin="0s" repeatCount="indefinite"/></text>
    <text x="18" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FF63BE">&gt; code<animate attributeName="opacity" values=".45;1;.45" dur="2s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="18" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FF63BE">&gt; ship<animate attributeName="opacity" values=".45;1;.45" dur="2s" begin="1s" repeatCount="indefinite"/></text>
    <text x="18" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#FF63BE">&gt; repeat<animate attributeName="opacity" values=".45;1;.45" dur="2s" begin="1.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- intro -->
  <text x="54" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#FF63BE">&gt; hi, i'm li0kei</text>
  <text x="52" y="145" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="62" font-weight="700" letter-spacing="4" fill="#FFFFFF">pixie</text>
  <rect x="52" y="158" width="180" height="4" rx="2" fill="url(#pink)" filter="url(#glow)"/>
  <text x="54" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#9DA7B3">
    computer science student · networking major · lifelong learner
  </text>

  <text x="54" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E6EDF3">I learn by building practical things,</text>
  <text x="54" y="273" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E6EDF3">exploring web, mobile &amp; networking,</text>
  <text x="54" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#E6EDF3">and turning ideas into working projects.</text>
  <rect x="54" y="329" width="9" height="24" fill="#FF4FB3" filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtle footer label -->
  <text x="54" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6E7681">li0kei / profile README</text>
</svg>
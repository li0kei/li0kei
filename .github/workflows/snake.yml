name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pink contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF4FB3&color_dots=#161B22,#3A1830,#7A245B,#C23886,#FF4FB3
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF4FB3&color_dots=#0D1117,#3A1830,#7A245B,#C23886,#FF4FB3

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v5
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
